name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  installed-wheel:
    name: Installed wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Exercise installed artifact outside checkout
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys
          import venv
          from pathlib import Path

          checkout = Path.cwd()
          environment = Path(os.environ["RUNNER_TEMP"]) / "dreamrsi-wheel"
          venv.create(environment, with_pip=True)
          executable = environment / (
              "Scripts/python.exe" if sys.platform == "win32" else "bin/python"
          )
          wheel, = checkout.glob("dist/*.whl")
          subprocess.run([
              str(executable), "-m", "pip", "install", "--no-deps", str(wheel)
          ], check=True)
          subprocess.run([
              str(executable), "-I", str(checkout / "tests/test_installed_wheel.py")
          ], cwd=os.environ["RUNNER_TEMP"], check=True)

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check src tests examples
      - run: python -m pyright
      - run: python -m build

  optional-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev,langchain]"
      - run: python -m pytest tests/test_integrations.py -q
