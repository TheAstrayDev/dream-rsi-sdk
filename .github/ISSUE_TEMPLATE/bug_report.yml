name: Bug report
description: A reproducible SDK failure
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and SDK version or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Self-contained code without tokens, passwords, or private data
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
